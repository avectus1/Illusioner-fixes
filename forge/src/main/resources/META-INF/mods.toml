[[mods]]
modId = "illusionerfixes"
version = "${file.jarVersion}"
displayName = "Illusioner Fixes"
description = '''
Unofficial fan-made addon, not affiliated with or endorsed by fqkeh (The Illusioner) or lukidonu (Luki's Woodland Mansions). If they would like it changed or taken down, I'll gladly do it.

Addon for fqkeh's The Illusioner (Forge 1.20.1).
- Keeps the intro cutscene from being cancelled when the boss gets hidden or unloaded.
- Removes leftover bosses from interrupted encounters, so a second Illusioner never appears.
- Corpse compatibility: corpses go to the centre of the current circle, follow it, and return to the overworld with their owner.
- Stops terrain water from waterlogging the mansion basement.
- Luki's Woodland Mansions: the basement is built under its new mansion too (stairs down from the central hall of the stone maze, straight in from the front door), and the sculk note block starts the fight.
- Oculus: The Illusioner now notices shader packs (it only looked for Iris), so its void sky and effects are drawn over the pack instead of under it.
- Embeddium / Oculus: the arena floor no longer shows as obsidian.
- Xaero's Minimap: no death waypoint for deaths in the corrupted void (you respawn where your items or corpse end up), and your real last deathpoint is left alone.'''
authors = "avectus1"

