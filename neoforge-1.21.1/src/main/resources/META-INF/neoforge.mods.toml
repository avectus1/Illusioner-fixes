[[mods]]
modId = "illusionerfixes"
version = "${file.jarVersion}"
displayName = "Illusioner Fixes"
description = '''
Unofficial fan-made addon, not affiliated with or endorsed by fqkeh (The Illusioner) or lukidonu (Luki's Woodland Mansions). If they would like it changed or taken down, I'll gladly do it.

Addon for fqkeh's The Illusioner (NeoForge 1.21.1).
- Keeps the intro cutscene from being cancelled when chunk mods (C2ME and similar) hide or unload the boss.
- Removes leftover bosses from interrupted encounters, so a second Illusioner never appears.
- Corpse compatibility: corpses go to the centre of the current circle, follow it, and return to the overworld with their owner.
- Stops terrain water from waterlogging the mansion basement.
- The basement takes the mansion's palette from mods that re-palette mansions through Lithostitched (Regions Unexplored redwood and blackwood, ...), and mansions that spawn in blackwood taiga now actually get blackwood.
- Luki's Woodland Mansions: the basement is built under its new mansion too (stairs down from the central trial-spawner hall of the stone maze, straight in from the front door), and the sculk note block starts the fight.
- Sodium / Iris: the arena floor no longer shows as obsidian (the mirror floor is drawn over Sodium's terrain, and hidden platforms are hidden in Sodium's chunk builder too).
- Xaero's Minimap: no death waypoint for deaths in the corrupted void (you respawn where your items or corpse end up), and your real last deathpoint is left alone.'''
authors = "avectus1"

