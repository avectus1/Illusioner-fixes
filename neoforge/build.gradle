plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'dev.avectus.illusionerfixes'
base { archivesName = 'illusioner-fixes' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            if (project.hasProperty('quickPlay')) { programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay')) }
            if (project.hasProperty('testScript')) { systemProperty 'illusionerfixes.test.script', project.property('testScript') }
            jvmArgument '-Xmx3G'
        }
        server { server(); programArgument '--nogui' }
    }
    mods { illusionerfixes { sourceSet(sourceSets.main) } }
}
dependencies {
    // The Illusioner itself; a widened copy only so javac accepts the package-private BossLifecycle
    // that the mixins touch from inside the mod's own classes. The real jar sits in run/mods.
    compileOnly files('libs/illusioner-compileonly-widened.jar')
    // Xaero's Minimap, only for the optional death-waypoint compat (applied only when it is installed).
    compileOnly files('libs/xaerominimap-compileonly.jar')
    // Sodium, only for the optional arena-floor masking in its chunk builder (applied only when it is installed).
    compileOnly files('libs/sodium-compileonly.jar', 'libs/sodium-fabric-rda-compileonly.jar', 'libs/sodium-fabric-bv-compileonly.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') {
    exclude 'dev/avectus/illusionerfixes/devtest/**'
    manifest { attributes('Implementation-Version': project.version, 'Implementation-Title': 'Illusioner Fixes') }
}
